name: Weekly APK build

on:
  push:
    branches: [main]
    paths:
      - "runtime-intelligence/**"
      - ".github/workflows/weekly-apk.yml"
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Count open bug issues
        id: bugs
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          count=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/issues?state=open&per_page=100" | jq -s 'add | [.[] | select(.pull_request == null and any(.labels[]?; .name == "bug"))] | length')
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "Open bug issues: $count"

      - name: Explain why scheduled build is skipped
        if: github.event_name == 'schedule' && steps.bugs.outputs.count < 10
        run: echo "Open bug issue count is below 10; scheduled build is not required."

      - name: Check out source
        if: github.event_name != 'schedule' || steps.bugs.outputs.count >= 10
        uses: actions/checkout@v4

      - name: Set up JDK 17
        if: github.event_name != 'schedule' || steps.bugs.outputs.count >= 10
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        if: github.event_name != 'schedule' || steps.bugs.outputs.count >= 10
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: latest
          accept-android-sdk-licenses: true
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      - name: Set up Gradle
        if: github.event_name != 'schedule' || steps.bugs.outputs.count >= 10
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
          cache-read-only: false

      - name: Run tests and build debug APK
        if: github.event_name != 'schedule' || steps.bugs.outputs.count >= 10
        working-directory: runtime-intelligence
        env:
          JAVA_TOOL_OPTIONS: "-Xmx1g -XX:MaxMetaspaceSize=512m"
        run: gradle :app:testDebugUnitTest :app:assembleDebug --build-cache --max-workers=1

      - name: Verify DEX contains no device-statistics code
        if: (github.event_name != 'schedule' || steps.bugs.outputs.count >= 10) && success()
        working-directory: runtime-intelligence
        run: |
          python3 - <<'PY'
          from zipfile import ZipFile
          from pathlib import Path
          apk = Path("app/build/outputs/apk/debug/app-debug.apk")
          with ZipFile(apk) as archive:
              dex_files = [n for n in archive.namelist() if n == "classes.dex" or (n.startswith("classes") and n.endswith(".dex"))]
              if not dex_files:
                  raise SystemExit("No DEX files found in APK")
              for name in dex_files:
                  data = archive.read(name)
                  forbidden = [b"ActivityManager", b"getMemoryInfo", b"Device memory dashboard", b"Refresh memory statistics"]
                  found = [item.decode() for item in forbidden if item in data]
                  if found:
                      raise SystemExit(f"Removed device-statistics code still referenced in {name}: {found}")
          print(f"Verified {len(dex_files)} DEX file(s): device-statistics code not present.")
          PY

      - name: Upload debug APK artifact
        if: (github.event_name != 'schedule' || steps.bugs.outputs.count >= 10) && success()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-intelligence-debug-apk
          path: runtime-intelligence/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
