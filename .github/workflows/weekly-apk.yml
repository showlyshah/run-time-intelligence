name: Weekly APK build

on:
  push:
    branches: [main]
    paths:
      - "runtime-intelligence/**"
      - ".github/workflows/weekly-apk.yml"
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Count open bug issues
        id: bugs
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          count=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/issues?state=open&per_page=100" | jq -s 'add | [.[] | select(.pull_request == null and any(.labels[]?; .name == "bug"))] | length')
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "Open bug issues: $count"

      - name: Explain why scheduled build is skipped
        if: github.event_name == 'schedule' && steps.bugs.outputs.count < 10
        run: echo "Open bug issue count is below 10; scheduled build is not required."

      - name: Check out source
        if: github.event_name != 'schedule' || steps.bugs.outputs.count >= 10
        uses: actions/checkout@v4

      - name: Set up JDK 17
        if: github.event_name != 'schedule' || steps.bugs.outputs.count >= 10
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        if: github.event_name != 'schedule' || steps.bugs.outputs.count >= 10
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: latest
          accept-android-sdk-licenses: true
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      - name: Set up Gradle
        if: github.event_name != 'schedule' || steps.bugs.outputs.count >= 10
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
          cache-read-only: false

      - name: Run tests and compile APK
        if: github.event_name != 'schedule' || steps.bugs.outputs.count >= 10
        working-directory: runtime-intelligence
        env:
          JAVA_TOOL_OPTIONS: "-Xmx1g -XX:MaxMetaspaceSize=512m"
        run: gradle :app:testDebugUnitTest :app:assembleDebug --build-cache --max-workers=1

      - name: Install JADX decompiler
        if: (github.event_name != 'schedule' || steps.bugs.outputs.count >= 10) && success()
        run: |
          curl -fsSL "https://github.com/skylot/jadx/releases/download/v1.5.7/jadx-1.5.7.zip" -o "$RUNNER_TEMP/jadx.zip"
          mkdir -p "$RUNNER_TEMP/jadx"
          unzip -q "$RUNNER_TEMP/jadx.zip" -d "$RUNNER_TEMP/jadx"
          chmod +x "$RUNNER_TEMP/jadx/bin/jadx"
          "$RUNNER_TEMP/jadx/bin/jadx" --version

      - name: Decompile APK and verify device collection is absent
        if: (github.event_name != 'schedule' || steps.bugs.outputs.count >= 10) && success()
        working-directory: runtime-intelligence
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          OUT="$RUNNER_TEMP/jadx-output"
          # JADX can return exit code 3 when some unrelated/library classes cannot
          # be fully decompiled. Its output is still usable; require our app's
          # MainActivity to exist and inspect the entire app package below.
          JADX_STATUS=0
          "$RUNNER_TEMP/jadx/bin/jadx" --no-res --show-bad-code -d "$OUT" "$APK" || JADX_STATUS=$?
          if [ "$JADX_STATUS" -ne 0 ] && [ "$JADX_STATUS" -ne 3 ]; then
            echo "JADX failed unexpectedly with exit code $JADX_STATUS."
            exit "$JADX_STATUS"
          fi
          APP_SOURCES="$OUT/sources/com/logan/runtimeintelligence"
          if [ ! -f "$APP_SOURCES/MainActivity.java" ]; then
            echo "JADX did not produce the app's MainActivity.java; cannot verify the APK."
            exit 1
          fi
          if grep -R -n -E 'ActivityManager|getMemoryInfo|totalMem|availMem|Total RAM:|Available RAM:|Estimated used RAM:' "$APP_SOURCES"; then
            echo "Device-statistics collection code was found in the decompiled app."
            exit 1
          fi
          if [ "$JADX_STATUS" -eq 3 ]; then
            echo "JADX reported non-fatal errors in other classes; app package verification succeeded."
          else
            echo "JADX decompilation passed."
          fi
          echo "Verified: app package contains no device RAM collection code."

      - name: Upload debug APK artifact
        if: (github.event_name != 'schedule' || steps.bugs.outputs.count >= 10) && success()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-intelligence-debug-apk
          path: runtime-intelligence/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
