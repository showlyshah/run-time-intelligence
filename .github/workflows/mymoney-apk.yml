name: LoganTech Expenses Tracker Android APK
on:
  push:
    branches: [main]
    paths:
      - "expense-tracker/**"
      - ".github/workflows/mymoney-apk.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: latest
          accept-android-sdk-licenses: true
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build temporary debug APK
        working-directory: expense-tracker
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Upload installable test APK
        uses: actions/upload-artifact@v4
        with:
          name: LoganTech-Expenses-Tracker-0.3.4-debug
          path: expense-tracker/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
