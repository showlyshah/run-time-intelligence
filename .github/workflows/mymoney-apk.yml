name: LoganTech Expenses Tracker Android APK
on:
  push:
    branches: [main]
    paths:
      - "expense-tracker/**"
      - ".github/workflows/mymoney-apk.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: latest
          accept-android-sdk-licenses: true
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Prepare permanent app signing key
        env:
          LOGANTECH_KEYSTORE_BASE64: ${{ secrets.LOGANTECH_KEYSTORE_BASE64 }}
          LOGANTECH_KEYSTORE_PASSWORD: ${{ secrets.LOGANTECH_KEYSTORE_PASSWORD }}
          LOGANTECH_KEY_ALIAS: ${{ secrets.LOGANTECH_KEY_ALIAS }}
          LOGANTECH_KEY_PASSWORD: ${{ secrets.LOGANTECH_KEY_PASSWORD }}
        run: |
          test -n "$LOGANTECH_KEYSTORE_BASE64" || (echo "Missing GitHub Actions secret LOGANTECH_KEYSTORE_BASE64" && exit 1)
          test -n "$LOGANTECH_KEYSTORE_PASSWORD" || (echo "Missing GitHub Actions secret LOGANTECH_KEYSTORE_PASSWORD" && exit 1)
          test -n "$LOGANTECH_KEY_ALIAS" || (echo "Missing GitHub Actions secret LOGANTECH_KEY_ALIAS" && exit 1)
          test -n "$LOGANTECH_KEY_PASSWORD" || (echo "Missing GitHub Actions secret LOGANTECH_KEY_PASSWORD" && exit 1)
          echo "$LOGANTECH_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/logantech-release.jks"
          test -s "$RUNNER_TEMP/logantech-release.jks"
      - name: Build permanently signed APK
        working-directory: expense-tracker
        env:
          LOGANTECH_KEYSTORE_PATH: ${{ runner.temp }}/logantech-release.jks
          LOGANTECH_KEYSTORE_PASSWORD: ${{ secrets.LOGANTECH_KEYSTORE_PASSWORD }}
          LOGANTECH_KEY_ALIAS: ${{ secrets.LOGANTECH_KEY_ALIAS }}
          LOGANTECH_KEY_PASSWORD: ${{ secrets.LOGANTECH_KEY_PASSWORD }}
        run: gradle :app:assembleRelease --no-daemon --stacktrace
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: LoganTech-Expenses-Tracker-apk
          path: expense-tracker/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
      - name: Read app version
        id: version
        working-directory: expense-tracker
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Publish versioned GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: LoganTech Expenses Tracker v${{ steps.version.outputs.version }}
          body: "LoganTech Expenses Tracker Android release. Install the permanently signed APK attached to this release."
          files: expense-tracker/app/build/outputs/apk/release/app-release.apk
          make_latest: true
